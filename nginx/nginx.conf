user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  sendfile on;

  # 管理页跳转入口（可选）：80 端口提示走 443
  server {
    listen 80;
    server_name _;
    location / { return 200 "intranet site (http). use https.\n"; }
  }

  server {
    listen 443 ssl;
    server_name demo.internal;

    ssl_certificate     /etc/nginx/certs/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
      root /usr/share/nginx/html;
      index index.html;
    }
  }
}
